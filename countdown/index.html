<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Timer</title>
  <link rel="stylesheet" href="style.css">
  <script>
    // 描画前にテーマを確定させ、初回のちらつきを防ぐ。キーは app.js の THEME_KEY と揃える
    try {
      var saved = localStorage.getItem('timer:countdown:theme');
      document.documentElement.dataset.theme =
        saved || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    } catch (e) {}
  </script>
</head>
<body>
  <div class="corner-controls">
    <button class="sound-toggle" id="soundToggle" type="button" aria-pressed="true">
      <svg class="sound-toggle__on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M4 9.5h3.2L12 5.6v12.8L7.2 14.5H4z" />
        <path d="M16.2 8.8a4.5 4.5 0 0 1 0 6.4M18.8 6.2a8 8 0 0 1 0 11.6" />
      </svg>
      <svg class="sound-toggle__off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M4 9.5h3.2L12 5.6v12.8L7.2 14.5H4z" />
        <path d="M16.5 9.8l4.4 4.4M20.9 9.8l-4.4 4.4" />
      </svg>
      <span class="sound-toggle__on">Sound on</span>
      <span class="sound-toggle__off">Sound off</span>
    </button>

    <div class="theme-switch" id="themeSwitch" role="group" aria-label="Theme">
      <button class="theme-switch__btn" type="button" data-theme-value="light" aria-label="Light mode" aria-pressed="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
          <circle cx="12" cy="12" r="4.2" />
          <path d="M12 2.2v2.3M12 19.5v2.3M4.4 4.4l1.6 1.6M18 18l1.6 1.6M2.2 12h2.3M19.5 12h2.3M4.4 19.6l1.6-1.6M18 6l1.6-1.6" />
        </svg>
      </button>
      <button class="theme-switch__btn" type="button" data-theme-value="dark" aria-label="Dark mode" aria-pressed="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M20.5 14.6A8.6 8.6 0 1 1 9.4 3.5a6.9 6.9 0 0 0 11.1 11.1z" />
        </svg>
      </button>
    </div>
  </div>

  <!-- 画面 1: 時間の設定 -->
  <main class="setup-screen" id="setupScreen">
    <h1 class="title">Countdown Timer</h1>

    <form class="setup" id="setup" autocomplete="off">
      <div class="time-input">
        <input class="seg" id="minutes" type="text" inputmode="numeric" maxlength="3" value="00" aria-label="Minutes">
        <span class="colon">:</span>
        <input class="seg" id="seconds" type="text" inputmode="numeric" maxlength="2" value="00" aria-label="Seconds">
      </div>

      <div class="presets" id="presets">
        <button type="button" class="chip" data-add="30">+30s</button>
        <button type="button" class="chip" data-add="60">+1m</button>
        <button type="button" class="chip" data-add="300">+5m</button>
        <button type="button" class="chip" data-add="600">+10m</button>
        <button type="button" class="chip" data-add="1800">+30m</button>
        <button type="button" class="reset-btn" id="clearBtn">Reset</button>
      </div>
    </form>

    <button class="btn btn--primary btn--large" id="startBtn" type="button">Start</button>

    <div class="checks">
      <label class="check">
        <input type="checkbox" id="soundCheck" checked>
        <span>Play a sound when time is up</span>
      </label>

      <label class="check">
        <input type="checkbox" id="notifyToggle">
        <span>Show a browser notification when time is up</span>
      </label>
    </div>

    <div class="hints">
      <p class="hint" id="setupHint"><kbd>Enter</kbd> to start</p>
      <p class="hint url-tip">
        <span>Set the time from the URL:</span>
        <span><code>?t=m5</code> 5 min</span>
        <span><code>?t=s30</code> 30 sec</span>
      </p>
    </div>
  </main>

  <!-- 画面 2: カウントダウン -->
  <section class="run-screen" id="runScreen" hidden>
    <output class="display" id="display" aria-live="off">00:00</output>

    <button class="pause-overlay" id="pauseOverlay" type="button" aria-label="Resume">
      <svg viewBox="0 0 100 100" aria-hidden="true">
        <circle class="pause-overlay__disc" cx="50" cy="50" r="47" />
        <path class="pause-overlay__play" d="M38 31 L72 50 L38 69 Z" />
      </svg>
    </button>

    <div class="run-ui" id="runUi">
      <p class="run-status" id="runStatus"></p>
      <div class="run-controls">
        <button class="btn btn--ghost" id="primaryBtn" type="button">Pause</button>
        <button class="btn btn--ghost" id="backBtn" type="button">Back to setup</button>
      </div>
      <p class="hint"><kbd>Space</kbd> <span id="runHintAction">Pause</span>&nbsp;&nbsp;&nbsp;<kbd>Esc</kbd> Back to setup</p>
    </div>

    <div class="bar"><div class="bar__fill" id="progress"></div></div>
  </section>

  <script src="app.js"></script>
</body>
</html>
