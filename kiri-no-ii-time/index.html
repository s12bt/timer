<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>キリのいい時間まで</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- 右上の操作。位置はここだけで持つ (countdown と同じ置き方) -->
  <div class="corner-controls">
    <button class="btn sound-toggle" id="soundToggle" type="button" aria-pressed="true">
      <svg class="sound-toggle__on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M4 9.5h3.2L12 5.6v12.8L7.2 14.5H4z" />
        <path d="M16.2 8.8a4.5 4.5 0 0 1 0 6.4M18.8 6.2a8 8 0 0 1 0 11.6" />
      </svg>
      <svg class="sound-toggle__off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M4 9.5h3.2L12 5.6v12.8L7.2 14.5H4z" />
        <path d="M16.5 9.8l4.4 4.4M20.9 9.8l-4.4 4.4" />
      </svg>
      <span class="sound-toggle__on">音が出ます</span>
      <span class="sound-toggle__off">消音</span>
    </button>
  </div>

  <!-- 画面は 1 枚。選ぶ場面と数える場面は同じ盤面の状態違いで、時計そのものは最後まで止めない。
       終点が壁時計の時刻なので、このタイマーには「開始」も「一時停止」も無い。
       目盛を押した時点で終わりの時刻が決まり、あとは現在時刻が追いつくのを待つだけ -->
  <main class="kiri is-setting" id="kiri">
    <!-- 選ぶ対象は時刻なので、盤面の上に置く。目盛を hover したときの行き先もここに出るので、
         視線が盤面から下まで往復せずに済む -->
    <div class="head">
      <p class="lead"><span class="lead__main" id="leadMain">何分まで<wbr>やる？</span><span class="lead__suffix" id="leadSuffix"></span></p>

      <!-- いま何をやっている時間なのかの書き置き (任意)。枠は書いている間と空のときだけ出し、
           書き終えたら枠を外して文字だけを置く。入力欄は 1 つで、見え方だけを CSS で切り替える -->
      <label class="memo">
        <svg class="memo__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M15.5 4.5l4 4L8.5 19.5H4.5v-4z" />
          <path d="M13 7l4 4" />
        </svg>
        <!-- 長く書いたときに折り返せるよう textarea にする。改行は入れさせず、Enter は書き終える操作 -->
        <textarea class="memo__input" id="memoInput" rows="1" placeholder="なにをする時間か書ける場所"
          maxlength="40" autocomplete="off" enterkeyhint="done" aria-label="なにをする時間か書ける場所"></textarea>
      </label>
    </div>

    <div class="stage">
      <svg class="dial" viewBox="0 0 200 200" aria-hidden="true">
        <!-- 白い文字盤を地から起こす。以降の層はすべてこの上に乗る -->
        <circle class="dial__face" cx="100" cy="100" r="97"></circle>

        <!-- 扇は文字盤のすぐ上。目盛にも数字にも針にも被らないよう、いちばん下の層に置く -->
        <path class="dial__wedge" id="wedge"></path>

        <!-- 扇の終わり側の境界。ここが選んだ時刻。数えている間だけ出る -->
        <line class="dial__edge" id="wedgeEdge"></line>

        <!-- 60 本の分目盛と 12 個の数字は JS が作る (繰り返しを HTML に書き写さない) -->
        <g class="dial__ticks" id="ticks"></g>
        <g class="dial__labels" id="labels"></g>

        <!-- 縁は目盛の後。目盛の先端をこの線で切り揃える -->
        <circle class="dial__rim" cx="100" cy="100" r="97"></circle>


        <!-- 針は根元から先まで同じ太さの線。掛け時計の針は先へ向けて細らない -->
        <line class="dial__hand dial__hand--hour" id="hourHand"></line>
        <line class="dial__hand dial__hand--minute" id="minuteHand"></line>
        <circle class="dial__pin" cx="100" cy="100" r="2.2"></circle>
      </svg>

      <!-- 当たり判定は見た目の層とは別に持ち、最前面に置く。
           1 目盛 = 30 度の扇で、盤面のどこを押しても一番近い 5 分の目盛に付く。
           button ではなく SVG の path なので、role と tabindex でキーボードからも辿れるようにする -->
      <svg class="hits" viewBox="0 0 200 200" id="hits">
        <!-- hover / focus 中の扇を二等分する線。この線の先にある目盛が、押したときに選ばれる時刻。
             扇 1 枚は 30 度あって、どの時刻に付くのかが面だけでは読めないので、中心線で指す。
             位置は JS が置き、当たり判定を作ったあとで末尾へ回して最前面に出す -->
        <line class="aim" id="aimLine"></line>
      </svg>
    </div>

    <!-- 盤面の外に出す。中央は針が通るので、文字を置くと時計として読めなくなる -->
    <div class="readout">
      <!-- 添えの語は数字の上。「のこり」と読んでから数字を読む順にする -->
      <p class="readout__note" id="noteLabel"></p>
      <p class="readout__remain" id="remain" role="timer" aria-live="off">
        <span class="seg" id="remainValue">0:00</span>
      </p>
      <!-- 残り時間を隠す / 出す。「のこり」と数字の範囲そのものを押せる場所にする (ちょっとした隠し機能なので、普段は見せない)。
           触れると右上に押したときに起きることのアイコンが出る。
           隠している間は、何も無くなると不安なので範囲をごく薄く塗り、右上に「隠している」印を残す。
           隠している間に触れると、その間だけ残り時間を薄く覗かせる -->
      <button class="remain-toggle" id="remainToggle" type="button" aria-pressed="false" aria-label="残り時間を隠す">
        <svg class="remain-toggle__hide" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M3 12s3.5-6 9-6 9 6 9 6-3.5 6-9 6-9-6-9-6z" />
          <circle cx="12" cy="12" r="2.6" />
          <path d="M4 4l16 16" />
        </svg>
        <svg class="remain-toggle__show" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M3 12s3.5-6 9-6 9 6 9 6-3.5 6-9 6-9-6-9-6z" />
          <circle cx="12" cy="12" r="2.6" />
        </svg>
      </button>
    </div>

    <div class="controls">
      <button class="btn reset" id="resetBtn" type="button">時間を選び直す</button>
    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
