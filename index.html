<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Timers</title>
  <style>
    /* 一覧の器は各タイマーから独立させる。テーマも持たず、地は白・インクは無彩色・書体はシステムのもの。
       ただし右の数字だけは各タイマーの見本として、本体の書体とスタイルをそのまま出す (下の「数字」を参照) */
    :root {
      color-scheme: light;
      --text: #1a1a1a;
      --text-dim: #6b6b6b;
      --line: rgba(0, 0, 0, 0.14);
      --line-faint: rgba(0, 0, 0, 0.08);
    }

    /* zen の数字用。実体は zen が自前配信しているものをそのまま読む (一覧 → zen の依存はこの 1 箇所だけ)。
       ライセンスは SIL Open Font License 1.1 で、全文と著作権表示は zen/fonts/OFL.txt にある。
       font-display は zen (block) と変えて swap にする。一覧は待たせる画面ではないので、
       まず出してから差し替える方がよい */
    @font-face {
      font-family: 'Manrope';
      font-style: normal;
      font-weight: 500;
      font-display: swap;
      src: url('zen/fonts/manrope-500-latin.woff2') format('woff2');
    }

    * { box-sizing: border-box; }

    html { -webkit-text-size-adjust: 100%; }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      background: #ffffff;
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
        "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", "Hiragino Sans", Meiryo, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    .page {
      max-width: 640px;
      margin: 0 auto;
      padding: 72px 24px 48px;
    }

    .page__title {
      margin: 0;
      font-size: 26px;
      font-weight: 600;
    }

    .page__lead {
      margin: 8px 0 0;
      font-size: 14px;
      color: var(--text-dim);
    }

    /* 面で区切らず、罫線で並べる */
    .timers {
      margin: 40px 0 0;
      padding: 0;
      list-style: none;
      border-top: 1px solid var(--line-faint);
    }

    .timer-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      padding: 24px 4px;
      border-bottom: 1px solid var(--line-faint);
      color: inherit;
      text-decoration: none;
    }

    /* 地に色を敷かず、数字も各タイマーの色で固定したいので、hover はタイトルの下線だけで返す。
       罫線は行を区切る役に徹させ、状態では動かさない。
       キーボードで辿るときも同じ見え方になるよう :focus-visible にも同じ返しを付ける */
    .timer-row:hover .timer-row__name,
    .timer-row:focus-visible .timer-row__name {
      text-decoration: underline;
      text-decoration-thickness: 1px;
      text-underline-offset: 3px;
    }

    .timer-row:focus-visible {
      outline: 1px solid var(--line);
      outline-offset: 3px;
    }

    .timer-row__body { min-width: 0; }

    .timer-row__name {
      margin: 0;
      font-size: 16px;
      font-weight: 600;
    }

    .timer-row__desc {
      margin: 6px 0 0;
      font-size: 13px;
      line-height: 1.6;
      color: var(--text-dim);
    }

    /* ============ 数字 ============ */

    /* ここだけは各タイマーの顔を見せる場所。書体・太さ・字間・色は本体から写している。
       写しなので、タイマー側の数字の見た目を変えたらこの修飾クラスも手で合わせること。
       大きさだけは一覧の都合で揃える (本体はどちらも画面幅に追従する clamp を使っている)。
       地の陰影は持ち込まない。zen の text-shadow は温白 (#f7f6f3) の上で光る作りなので、
       白地のここでは光の側が効かず、影だけが汚れとして残る */
    .timer-row__face {
      flex: none;
      font-size: 40px;
      font-variant-numeric: tabular-nums;
      line-height: 1;
    }

    /* countdown: SF Pro Display の Bold。Mac 以外は各 OS のシステムフォントの太字に落ちる */
    .timer-row__face--countdown {
      font-family: "SF Pro Display", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
        "Helvetica Neue", system-ui, sans-serif;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: #131a2b;
    }

    /* zen: Manrope の中庸。静けさを保ったまま芯を持たせる太さ */
    .timer-row__face--zen {
      font-family: Manrope, "SF Pro Display", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
        "Helvetica Neue", system-ui, sans-serif;
      font-weight: 500;
      letter-spacing: 0.02em;
      color: rgba(63, 58, 51, 0.52);
    }

    /* コロンを視覚的な中心まで持ち上げる量も書体ごとに違う。本体と同じ値を使う。
       position: relative なら幅・高さは変わらないので、数字の位置には影響しない */
    .timer-row__colon {
      position: relative;
      display: inline-block;
    }

    .timer-row__face--countdown .timer-row__colon { top: -0.015em; }

    .timer-row__face--zen .timer-row__colon {
      top: -0.1em;
      padding: 0 2px;
    }

    @media (max-width: 480px) {
      .page { padding-top: 48px; }
      .timer-row { gap: 16px; padding: 20px 2px; }
      .timer-row__face { font-size: 32px; }
    }
  </style>
</head>
<body>
  <main class="page">
    <h1 class="page__title">Timers</h1>
    <p class="page__lead">A collection of timers that run in your browser.</p>

    <!-- タイマーを追加したら、ここに li を 1 つ足す -->
    <ul class="timers">
      <li>
        <a class="timer-row" href="countdown/">
          <div class="timer-row__body">
            <h2 class="timer-row__name">Countdown</h2>
            <p class="timer-row__desc">Set minutes and seconds, then count down to zero with an alarm.</p>
          </div>
          <span class="timer-row__face timer-row__face--countdown" aria-hidden="true">05<span class="timer-row__colon">:</span>00</span>
        </a>
      </li>
      <li>
        <a class="timer-row" href="zen/">
          <div class="timer-row__body">
            <h2 class="timer-row__name">Zen</h2>
            <p class="timer-row__desc">A quiet timer for reflection. The ring recedes and a drop falls every ten seconds.</p>
          </div>
          <span class="timer-row__face timer-row__face--zen" aria-hidden="true">15<span class="timer-row__colon">:</span>00</span>
        </a>
      </li>
    </ul>
  </main>
</body>
</html>
